trigger: none

pr:
  branches:
    include:
      - master


parameters:
# Environment used for Terraform validation and backend selection
- name: environment
  displayName: Terraform environment
  type: string
  default: dev
  values:
    - dev
    - uat
    - prod


pool:
  vmImage: ubuntu-latest


variables:
# Terraform CLI version used in CI validation
  terraformVersion: '1.10.5'


steps:

- checkout: self
  persistCredentials: true


- task: TerraformInstaller@1
  displayName: Install Terraform
  inputs:
    terraformVersion: $(terraformVersion)


- script: terraform fmt -check -recursive
  displayName: Terraform format check


- task: TerraformTaskV4@4
  displayName: Terraform Init
  inputs:
    provider: azurerm
    command: init
    workingDirectory: environments/${{ parameters.environment }}
    backendServiceArm: sc-azure-lab-terraform-${{ parameters.environment }}
    backendAzureRmResourceGroupName: rg-tfstate-azure-lab-01
    backendAzureRmStorageAccountName: satfstateazurelab01
    backendAzureRmContainerName: tfstate
    backendAzureRmKey: environments/${{ parameters.environment }}/terraform.tfstate


- task: TerraformTaskV4@4
  displayName: Terraform Validate
  inputs:
    provider: azurerm
    command: validate
    workingDirectory: environments/${{ parameters.environment }}


- task: TerraformTaskV4@4
  displayName: Terraform Plan
  inputs:
    provider: azurerm
    command: plan
    workingDirectory: environments/${{ parameters.environment }}
    environmentServiceNameAzureRM: sc-azure-lab-terraform-${{ parameters.environment }}
    commandOptions: '-out=tfplan'


- script: |
    terraform show -no-color tfplan > tfplan.txt
  workingDirectory: environments/${{ parameters.environment }}
  displayName: Render Terraform Plan


- task: PowerShell@2
  displayName: Post Terraform Plan to PR
  condition: and(succeeded(), eq(variables['Build.Reason'], 'PullRequest'))

  inputs:
    targetType: inline
    pwsh: true

    script: |

      Write-Host "Build reason: $(Build.Reason)"
      Write-Host "PR ID: $(System.PullRequest.PullRequestId)"


      if (-not $env:SYSTEM_PULLREQUEST_PULLREQUESTID) {
          Write-Host "No Pull Request context found. Skipping PR comment."
          exit 0
      }


      $planPath = "$(System.DefaultWorkingDirectory)/environments/${{ parameters.environment }}/tfplan.txt"


      if (!(Test-Path $planPath)) {
          Write-Error "Terraform plan output file not found: $planPath"
          exit 1
      }


      $plan = Get-Content $planPath -Raw


      $comment = @(
        "## Terraform ${{ parameters.environment }} validation"
        ""
        "✅ Terraform fmt passed"
        "✅ Terraform init passed"
        "✅ Terraform validate passed"
        "✅ Terraform plan completed"
        ""
        "### Terraform Plan"
        ""
        '```text'
        $plan
        '```'
      ) -join "`n"


      $body = @{
        comments = @(
          @{
            parentCommentId = 0
            content = $comment
            commentType = 1
          }
        )
        status = 1
      } | ConvertTo-Json -Depth 10


      $uri = "$(System.CollectionUri)$(System.TeamProject)/_apis/git/repositories/$(Build.Repository.ID)/pullRequests/$(System.PullRequest.PullRequestId)/threads?api-version=7.1"


      Invoke-RestMethod `
        -Uri $uri `
        -Method Post `
        -Headers @{
          Authorization = "Bearer $env:SYSTEM_ACCESSTOKEN"
        } `
        -ContentType "application/json" `
        -Body $body

- task: PublishPipelineArtifact@1
  displayName: Publish Terraform Plan Artifact
  inputs:
    targetPath: '$(System.DefaultWorkingDirectory)/environments/${{ parameters.environment }}/tfplan'
    ArtifactName: 'TerraformPlan'


  env:
    SYSTEM_ACCESSTOKEN: $(System.AccessToken)