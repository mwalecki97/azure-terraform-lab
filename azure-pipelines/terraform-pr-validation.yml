trigger: none

pr:
  branches:
    include:
      - master

pool:
  vmImage: ubuntu-latest

variables:
  terraformVersion: '1.9.8'

steps:

- task: TerraformInstaller@1
  displayName: Install Terraform
  inputs:
    terraformVersion: $(terraformVersion)


- script: terraform fmt -check -recursive
  displayName: Terraform format check


- task: TerraformTaskV4@4
  displayName: Terraform Init
  inputs:
    provider: azurerm
    command: init
    workingDirectory: environments/dev
    backendServiceArm: sc-azure-lab-terraform-dev
    backendAzureRmResourceGroupName: rg-tfstate-azure-lab-01
    backendAzureRmStorageAccountName: satfstateazurelab01
    backendAzureRmContainerName: tfstate
    backendAzureRmKey: environments/dev/terraform.tfstate


- task: TerraformTaskV4@4
  displayName: Terraform Validate
  inputs:
    provider: azurerm
    command: validate
    workingDirectory: environments/dev

- task: TerraformTaskV4@4
  displayName: Terraform Plan
  inputs:
    provider: azurerm
    command: plan
    workingDirectory: environments/dev
    environmentServiceNameAzureRM: sc-azure-lab-terraform-dev